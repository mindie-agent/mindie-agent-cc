name: Adapter checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  component:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the declared runtime
        env:
          PIP_RETRIES: '0'
          GIT_TERMINAL_PROMPT: '0'
        run: python -m pip install -r runtime-requirements.txt
      - name: Install the local-candidate build backend
        # hatchling builds the pinned knowledge tree. It is not a runtime pin.
        env:
          PIP_RETRIES: '0'
        run: python -m pip install hatchling==1.32.4
      - name: Check out the declared knowledge commit
        uses: actions/checkout@v4
        with:
          repository: mindie-agent/knowledge
          ref: 465cac9342ed4a78284e99e89e5c6df80f7bedd4
          path: .ci/knowledge
          fetch-depth: 0
          persist-credentials: false
      - name: Component contracts (not native harness acceptance)
        env:
          PYTHONUTF8: '0'
          MINDIE_TEST_KNOWLEDGE_CHECKOUT: ${{ github.workspace }}/.ci/knowledge
          # Frozen peer scripts vendored at tests/fixtures/kimi-86de2c3.
          # PROVENANCE.json records the source revision and file hashes.
          MINDIE_TEST_KIMI_SCRIPTS: ${{ github.workspace }}/tests/fixtures/kimi-86de2c3/scripts
        run: python -m unittest discover -s tests
