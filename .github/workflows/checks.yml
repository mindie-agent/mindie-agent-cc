name: Adapter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  component:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the declared runtime
        env:
          PIP_RETRIES: '0'
          GIT_TERMINAL_PROMPT: '0'
        run: python -m pip install -r runtime-requirements.txt
      - name: Install the local-candidate build backend
        # hatchling builds the pinned knowledge tree. It is not a runtime pin.
        env:
          PIP_RETRIES: '0'
        run: python -m pip install hatchling==1.32.4
      - name: Check out the declared knowledge commit
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -eu
          commit=$(python -c 'import pathlib,re,sys; text=pathlib.Path("runtime-requirements.txt").read_text(); found=re.findall(r"^mindie-knowledge @ git\+https://github\.com/mindie-agent/knowledge@([0-9a-f]{40})$", text, re.M); sys.exit("runtime-requirements.txt must contain one mindie-knowledge pin") if len(found)!=1 else print(found[0])') || exit 1
          dest="${RUNNER_TEMP}/mindie-knowledge"
          rm -rf "$dest"
          git init "$dest"
          git -C "$dest" remote add origin https://github.com/mindie-agent/knowledge.git
          git -C "$dest" fetch --depth 1 origin "$commit"
          git -C "$dest" checkout --detach FETCH_HEAD
          head=$(git -C "$dest" rev-parse HEAD)
          test "$head" = "$commit"
          test "$(git -C "$dest" cat-file -t HEAD)" = "commit"
          echo "MINDIE_TEST_KNOWLEDGE_CHECKOUT=$dest" >> "$GITHUB_ENV"
      - name: Product configuration outcomes
        run: python -m unittest discover -s tests -p test_product_flow.py -v
      - name: Component contracts (not native harness acceptance)
        env:
          # Frozen peer scripts vendored at tests/fixtures/kimi-86de2c3.
          # PROVENANCE.json records the source revision and file hashes.
          MINDIE_TEST_KIMI_SCRIPTS: ${{ github.workspace }}/tests/fixtures/kimi-86de2c3/scripts
        run: python -m unittest discover -s tests
