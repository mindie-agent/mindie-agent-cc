name: Adapter checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  component:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.8'
          python-version: '3.13'
      - name: Install the complete locked runtime and test tools
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
          GIT_CONFIG_KEY_1: core.autocrlf
          GIT_CONFIG_VALUE_1: 'false'
        run: uv sync --locked --no-editable --group test
      - name: Read the locked knowledge commit
        id: pins
        shell: python
        run: |
          import importlib.metadata as metadata, json, os
          direct = json.loads(metadata.distribution("mindie-knowledge").read_text("direct_url.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("knowledge=" + direct["vcs_info"]["commit_id"] + "\n")
      - name: Validate Harness interfaces and immutable release metadata
        run: uv run --locked --no-editable --group test python scripts/setup.py release-metadata --source . --tests tests --revision ${{ github.sha }}
      - name: Out-of-tree wheel build and seed verification smoke check
        shell: bash
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/mindie-cc-dist"
          uv venv "$RUNNER_TEMP/mindie-cc-smoke-venv" --python 3.13
          uv pip install --python "$RUNNER_TEMP/mindie-cc-smoke-venv" --no-deps "$RUNNER_TEMP"/mindie-cc-dist/*.whl
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/mindie-cc-smoke-venv/bin/python" -c "import mindie_cc.host_adapter as h; info = h.verify_bundled_seed(); assert info['schema'] == 'mindie-harness-seed/1'" 2>/dev/null || "$RUNNER_TEMP/mindie-cc-smoke-venv/Scripts/python.exe" -c "import mindie_cc.host_adapter as h; info = h.verify_bundled_seed(); assert info['schema'] == 'mindie-harness-seed/1'")
      - name: Check out the declared knowledge commit
        uses: actions/checkout@v4
        with:
          repository: mindie-agent/knowledge
          ref: ${{ steps.pins.outputs.knowledge }}
          path: .ci/knowledge
          fetch-depth: 0
          persist-credentials: false
      - name: Component contracts (not native harness acceptance)
        env:
          PYTHONUTF8: '0'
          MINDIE_TEST_KNOWLEDGE_CHECKOUT: ${{ github.workspace }}/.ci/knowledge
        run: uv run --locked --no-editable --group test python -m pytest -q -m "not live_npu"

  release-ready:
    name: release-ready
    needs: [component]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values()), "required CI failed or was skipped"'
