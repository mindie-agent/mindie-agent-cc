name: Adapter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  component:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the declared runtime
        env:
          PIP_RETRIES: '0'
          GIT_TERMINAL_PROMPT: '0'
        run: python -m pip install -r runtime-requirements.txt
      - name: Product configuration outcomes
        run: python -m unittest discover -s tests -p test_product_flow.py -v
      - name: Component contracts (not native harness acceptance)
        env:
          # Frozen peer scripts vendored at tests/fixtures/kimi-86de2c3.
          # PROVENANCE.json records the source revision and file hashes.
          MINDIE_TEST_KIMI_SCRIPTS: ${{ github.workspace }}/tests/fixtures/kimi-86de2c3/scripts
        run: python -m unittest discover -s tests
