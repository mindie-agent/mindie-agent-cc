name: Adapter checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  component:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.8'
          python-version: '3.13'
      - name: Install the complete locked runtime and test tools
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: uv sync --locked --no-editable --group test
      - name: Read the locked knowledge commit
        id: pins
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, "scripts")
          from product_contract import requirements
          pin = requirements(".")[0]["mindie-knowledge"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("knowledge=" + pin + "\n")
      - name: Validate Harness interfaces and immutable release metadata
        run: uv run --locked --no-editable --group test python scripts/harness.py --source . --tests tests --revision ${{ github.sha }}
      - name: Check out the declared knowledge commit
        uses: actions/checkout@v4
        with:
          repository: mindie-agent/knowledge
          ref: ${{ steps.pins.outputs.knowledge }}
          path: .ci/knowledge
          fetch-depth: 0
          persist-credentials: false
      - name: Component contracts (not native harness acceptance)
        env:
          PYTHONUTF8: '0'
          MINDIE_TEST_KNOWLEDGE_CHECKOUT: ${{ github.workspace }}/.ci/knowledge
        run: uv run --locked --no-editable --group test python -m pytest -q -m "not live_npu"
