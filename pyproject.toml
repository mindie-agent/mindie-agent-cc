[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mindie-agent-cc"
version = "0.1.26"
description = "Native Claude Code adapter for MindIE Agent"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@c991b64a1ead277b5ce91b7835337b01aed03998",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@c4d38f99c1ef5aace1c088af07647941adc2d394",
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@96c40049e2fc8e53676f557cb8144421efcfe8ed",
  "mindie-debugger @ git+https://github.com/mindie-agent/debugger@33052a2fc10c7475e4b819577870ca822efcebd0",
  "mindie-profiler @ git+https://github.com/mindie-agent/profiler@609d555d84857309ac5cb8214da7309f1b783ef0",
  "mindie-sim @ git+https://github.com/mindie-agent/sim@9dbab02f10843c7b829d6fda7e7b9ad89e4f92e5",
  "mindie-coordinator @ git+https://github.com/mindie-agent/coordinator@33e2c6966d21d62969a2148145e74885dc826e3c",
]

[dependency-groups]
test = [
  "pytest==9.1.1",
  "hatchling==1.32.4",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.hatch.build.targets.wheel.sources]
scripts = "mindie_cc"

[tool.hatch.build.targets.wheel.force-include]
"product-contract.json" = "mindie_cc/resources/product-contract.json"
"pyproject.toml" = "mindie_cc/resources/pyproject.toml"
"uv.lock" = "mindie_cc/resources/uv.lock"
".claude-plugin/plugin.json" = "mindie_cc/resources/plugin.json"
"harness-compatibility.json" = "mindie_cc/resources/harness-compatibility.json"

[tool.uv]
# The reviewed plugin selection also replaces older transitive component pins.
override-dependencies = [
  "mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@c991b64a1ead277b5ce91b7835337b01aed03998",
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@96c40049e2fc8e53676f557cb8144421efcfe8ed",
  "mindie-debugger @ git+https://github.com/mindie-agent/debugger@33052a2fc10c7475e4b819577870ca822efcebd0",
  "mindie-profiler @ git+https://github.com/mindie-agent/profiler@609d555d84857309ac5cb8214da7309f1b783ef0",
  "mindie-sim @ git+https://github.com/mindie-agent/sim@9dbab02f10843c7b829d6fda7e7b9ad89e4f92e5",
  "mindie-coordinator @ git+https://github.com/mindie-agent/coordinator@33e2c6966d21d62969a2148145e74885dc826e3c",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@c4d38f99c1ef5aace1c088af07647941adc2d394",
]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "uv.lock" },
  { file = "scripts/**/*.py" },
  { file = "product-contract.json" },
  { file = ".claude-plugin/plugin.json" },
  { file = "harness-compatibility.json" },
]
