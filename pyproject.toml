[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mindie-agent-cc"
version = "0.0.3"
description = "Native Claude Code adapter for MindIE Agent"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@8e4377bacdb0d5ff529217c5963a68f989e0fe5d",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@293045f87193fbe749dd161f3fa4bd6a8fbff37f",
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@57ae6487391ffcd0e5342345dbeb7fd859c4f7d5",
]

[dependency-groups]
test = ["pytest==9.1.1", "hatchling==1.32.4"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.hatch.build.targets.wheel.sources]
scripts = "mindie_cc"

[tool.hatch.build.targets.wheel.force-include]
"product-contract.json" = "mindie_cc/resources/product-contract.json"
"pyproject.toml" = "mindie_cc/resources/pyproject.toml"
"uv.lock" = "mindie_cc/resources/uv.lock"
".claude-plugin/plugin.json" = "mindie_cc/resources/plugin.json"
"harness-compatibility.json" = "mindie_cc/resources/harness-compatibility.json"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "uv.lock" },
  { file = "scripts/**/*.py" },
  { file = "product-contract.json" },
  { file = ".claude-plugin/plugin.json" },
  { file = "harness-compatibility.json" },
]
