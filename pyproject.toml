[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mindie-agent-cc"
version = "0.1.16"
description = "Native Claude Code adapter for MindIE Agent"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@1840bd4e238e718676768489058917818d18cd3c",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@131b24533479e9cefc572144adccdcb345f70846",
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@f338788cecc56f7aff1dccab1d53426c9e28fe7f",
  "mindie-debugger @ git+https://github.com/mindie-agent/debugger@e9406b2b178335190d5cb59dff4d6985894497ba",
  "mindie-profiler @ git+https://github.com/mindie-agent/profiler@79d97e75bff7351b0472b93c03b072c1cf47f5e7",
  "mindie-sim @ git+https://github.com/mindie-agent/sim@dbadff04b60937a0722b0a227cdad01beed083cd",
  "mindie-coordinator @ git+https://github.com/mindie-agent/coordinator@14d7cec7247bdcbea9b9878db4770e3a05a6ea41",
]

[dependency-groups]
test = [
  "pytest==9.1.1",
  "hatchling==1.32.4",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.hatch.build.targets.wheel.sources]
scripts = "mindie_cc"

[tool.hatch.build.targets.wheel.force-include]
"product-contract.json" = "mindie_cc/resources/product-contract.json"
"pyproject.toml" = "mindie_cc/resources/pyproject.toml"
"uv.lock" = "mindie_cc/resources/uv.lock"
".claude-plugin/plugin.json" = "mindie_cc/resources/plugin.json"
"harness-compatibility.json" = "mindie_cc/resources/harness-compatibility.json"

[tool.uv]
# The reviewed plugin selection also replaces older transitive component pins.
override-dependencies = [
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@f338788cecc56f7aff1dccab1d53426c9e28fe7f",
  "mindie-sim @ git+https://github.com/mindie-agent/sim@dbadff04b60937a0722b0a227cdad01beed083cd",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@131b24533479e9cefc572144adccdcb345f70846",
]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "uv.lock" },
  { file = "scripts/**/*.py" },
  { file = "product-contract.json" },
  { file = ".claude-plugin/plugin.json" },
  { file = "harness-compatibility.json" },
]
