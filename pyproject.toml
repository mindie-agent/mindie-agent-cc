[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mindie-agent-cc"
version = "0.0.3"
description = "Native Claude Code adapter for MindIE Agent"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@704f75375210dccb034b8827959c028c25149061",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@0b84ac8a9e2fdccb66107bab21b59cdf59748aec",
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@c32a2a0d5b3a593cb2e68fc40b37fe3c8ca02be6",
]

[dependency-groups]
test = ["pytest==9.1.1", "hatchling==1.32.4"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.hatch.build.targets.wheel.sources]
scripts = "mindie_cc"

[tool.hatch.build.targets.wheel.force-include]
"product-contract.json" = "mindie_cc/resources/product-contract.json"
"pyproject.toml" = "mindie_cc/resources/pyproject.toml"
"uv.lock" = "mindie_cc/resources/uv.lock"
".claude-plugin/plugin.json" = "mindie_cc/resources/plugin.json"
"harness-compatibility.json" = "mindie_cc/resources/harness-compatibility.json"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "uv.lock" },
  { file = "scripts/**/*.py" },
  { file = "product-contract.json" },
  { file = ".claude-plugin/plugin.json" },
  { file = "harness-compatibility.json" },
]
