[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mindie-agent-cc"
version = "0.1.8"
description = "Native Claude Code adapter for MindIE Agent"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@6e921b205c00d592c25f849653cbfb72b73fe318",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@2a750ec8c74d7f053410d48dd820aeb542e7d3b1",
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@5ae643e19223f2181ecdbaa3edaf464137c4805e",
]

[dependency-groups]
test = [
  "pytest==9.1.1",
  "hatchling==1.32.4",
  "mindie-profiler @ git+https://github.com/mindie-agent/profiler@065b382d3bd0d39890fc8379798331ce059a65b4",
  "mindie-sim @ git+https://github.com/mindie-agent/sim@15f93f3f0247b2653d0e9441eae56959e4d16d4e",
  "mindie-coordinator @ git+https://github.com/mindie-agent/coordinator@0ec71fb947ab24df8e543dcf056f4f06664baad8",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.hatch.build.targets.wheel.sources]
scripts = "mindie_cc"

[tool.hatch.build.targets.wheel.force-include]
"product-contract.json" = "mindie_cc/resources/product-contract.json"
"pyproject.toml" = "mindie_cc/resources/pyproject.toml"
"uv.lock" = "mindie_cc/resources/uv.lock"
".claude-plugin/plugin.json" = "mindie_cc/resources/plugin.json"
"harness-compatibility.json" = "mindie_cc/resources/harness-compatibility.json"

[tool.uv]
# The reviewed plugin selection also replaces older transitive component pins.
override-dependencies = [
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@5ae643e19223f2181ecdbaa3edaf464137c4805e",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@2a750ec8c74d7f053410d48dd820aeb542e7d3b1",
]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "uv.lock" },
  { file = "scripts/**/*.py" },
  { file = "product-contract.json" },
  { file = ".claude-plugin/plugin.json" },
  { file = "harness-compatibility.json" },
]
